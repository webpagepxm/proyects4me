name: Torre Fuerte demo
on:
  push:
    paths:
      - 'torre-fuerte-demo/**'
      - 'fonts/**'
      - '.github/workflows/torre-fuerte-demo.yml'
  pull_request:
    paths:
      - 'torre-fuerte-demo/**'
      - 'fonts/**'
      - '.github/workflows/torre-fuerte-demo.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and shared model
        run: |
          node --check torre-fuerte-demo/model.js
          node --check torre-fuerte-demo/demo.js
          node torre-fuerte-demo/tests/model.cjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/torre-tools" --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.11.0
          "$RUNNER_TEMP/torre-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify responsive routes and commercial story
        env:
          TORRE_TEST_URL: http://127.0.0.1:8004/torre-fuerte-demo/
          TORRE_ARTIFACT_DIR: /tmp/torre-fuerte-review
        run: |
          python3 -m http.server 8004 --bind 127.0.0.1 > /tmp/torre-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8004/torre-fuerte-demo/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/torre-tools/node_modules" node torre-fuerte-demo/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torre-fuerte-review
          path: /tmp/torre-fuerte-review
          if-no-files-found: ignore
