name: Architecture brief
on:
  push:
    paths:
      - 'brief-arquitectura/**'
      - '.github/workflows/brief-arquitectura.yml'
  pull_request:
    paths:
      - 'brief-arquitectura/**'
      - '.github/workflows/brief-arquitectura.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and questionnaire rules
        run: |
          node --check brief-arquitectura/model.js
          node --check brief-arquitectura/brief.js
          node brief-arquitectura/tests/model.cjs
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/brief-tools" --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.11.0
          "$RUNNER_TEMP/brief-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify questionnaire, exports, accessibility and responsive layouts
        env:
          BRIEF_TEST_URL: http://127.0.0.1:8007/brief-arquitectura/
          BRIEF_ARTIFACT_DIR: /tmp/brief-arquitectura-review
        run: |
          python3 -m http.server 8007 --bind 127.0.0.1 > /tmp/brief-server.log 2>&1 &
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8007/brief-arquitectura/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/brief-tools/node_modules" node brief-arquitectura/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-arquitectura-review
          path: /tmp/brief-arquitectura-review
          if-no-files-found: ignore
