name: ROADMAP smoke
on:
  push:
    branches:
      - main
      - feature/roadmap-3-clean-ux
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ROADMAP build and state
        run: node tests/roadmap-smoke.cjs
